# Деплой на Selectel: сборка на runner, на VPS — rsync + PM2.
# Нужны секреты репозитория (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST   = IP или хост (например 178.72.168.156)
#   DEPLOY_USER   = SSH-пользователь (например root)
#   DEPLOY_SSH_KEY = приватный ключ целиком (-----BEGIN ... OPEN PRIVATE KEY-----)
# Публичный ключ этого же ключа должен быть в ~/.ssh/authorized_keys на сервере.
name: Deploy to Selectel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-selectel
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверка секретов
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          ok=1
          if [ -z "$DEPLOY_HOST" ]; then echo "::error::Нет секрета DEPLOY_HOST"; ok=0; fi
          if [ -z "$DEPLOY_USER" ]; then echo "::error::Нет секрета DEPLOY_USER"; ok=0; fi
          if [ -z "$DEPLOY_SSH_KEY" ]; then echo "::error::Нет секрета DEPLOY_SSH_KEY"; ok=0; fi
          if [ "$ok" != 1 ]; then
            echo "GitHub → репозиторий → Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          echo "Секреты DEPLOY_* на месте."

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install & build
        run: |
          npm ci
          npm run build

      - name: Prepare standalone bundle
        run: bash scripts/prepare-standalone-deploy.sh

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host deploy-target\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  StrictHostKeyChecking yes\n' "$SSH_HOST" "$SSH_USER" >> ~/.ssh/config

      - name: Rsync application
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
        run: rsync -az --delete -e ssh release/ "deploy-target:/mnt/data/hypeman/current/"

      - name: Link production env (вне rsync — не затирается)
        run: |
          ssh deploy-target 'test -f /mnt/data/hypeman/.env.production && ln -sf /mnt/data/hypeman/.env.production /mnt/data/hypeman/current/.env.production || true'

      - name: Rsync PM2 config
        run: scp infra/ecosystem.config.cjs "deploy-target:/mnt/data/hypeman/ecosystem.config.cjs"

      - name: PM2 reload
        run: |
          ssh deploy-target 'mkdir -p /mnt/data/hypeman/current/storage/{input,audio,scenes,output}'
          ssh deploy-target 'cd /mnt/data/hypeman && (pm2 describe hypeman >/dev/null 2>&1 && pm2 reload ecosystem.config.cjs --only hypeman --update-env || pm2 start ecosystem.config.cjs) && pm2 save'
